<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b8c">
<meta name="description" content="The Bulod — Canduhao Elementary School's online publication.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/the-bulod-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>The Bulod | Canduhao Elementary School</title>
<style>
:root{--blue:#073b8c;--blue2:#0d55b7;--yellow:#ffca16;--ink:#14223b;--muted:#66748a;--paper:#f5f8fc;--line:#e4eaf3;--white:#fff;--radius:20px;--shadow:0 10px 28px #12345a12}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer}.topline{height:5px;background:linear-gradient(90deg,var(--blue) 0 72%,var(--yellow) 72%)}.wrap{width:min(1160px,92%);margin:auto}
header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.head{display:flex;align-items:center;gap:15px;padding:12px 0}.logo{width:76px;height:76px;object-fit:contain;flex:none}.brand{min-width:0}.brand h1{font-size:clamp(1.35rem,3vw,2.05rem);line-height:1.05;margin:0;color:var(--blue);font-weight:800;letter-spacing:-1px}.brand p{margin:5px 0 0;color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.pill{border:0;border-radius:999px;padding:10px 16px;font-weight:700;background:var(--yellow);color:#17233b}.outline{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:var(--blue);font-weight:700}.nav{background:var(--blue);color:#fff}.nav-inner{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 0}.nav button{border:0;background:transparent;color:#eaf2ff;padding:10px 15px;border-radius:999px;font-weight:600;white-space:nowrap}.nav button.active,.nav button:hover{background:var(--yellow);color:var(--blue)}main{padding:26px 0 54px}.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:24px;align-items:stretch;background:linear-gradient(125deg,#062c6b,#0c58b8);border-radius:26px;padding:28px;color:white;overflow:hidden;box-shadow:var(--shadow)}.eyebrow{display:inline-block;background:var(--yellow);color:#15305a;padding:4px 10px;border-radius:7px;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.hero h2{font-size:clamp(2rem,4.3vw,3.4rem);line-height:1.1;letter-spacing:-1.5px;margin:16px 0 12px}.hero p{color:#e5efff;max-width:550px;margin:0 0 20px}.hero-image{min-height:260px;border-radius:20px;background:linear-gradient(0deg,#001c4a44,#001c4a00),url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1000&q=85') center/cover;display:flex;align-items:flex-end;padding:16px}.hero-image span{background:#fff;color:var(--blue);padding:7px 11px;border-radius:10px;font-size:.8rem;font-weight:700}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:32px 0 15px}.section-head h2{margin:0;color:var(--blue);font-size:1.45rem}.section-head p{margin:4px 0 0;color:var(--muted);font-size:.88rem}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}.card img{width:100%;height:190px;object-fit:cover;background:#e5edf8}.card-body{padding:17px;display:flex;flex-direction:column;flex:1}.tag{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--blue2)}.card h3{font-size:1.05rem;line-height:1.35;margin:7px 0}.meta{font-size:.76rem;color:var(--muted)}.card p{font-size:.88rem;color:#4d5c73;margin:10px 0 15px}.read{margin-top:auto;align-self:flex-start;border:0;background:#edf4ff;color:var(--blue);padding:9px 13px;border-radius:10px;font-weight:700}.empty{padding:34px;background:#fff;border:1px dashed #bdcbe0;border-radius:18px;color:var(--muted);text-align:center;grid-column:1/-1}.notice{margin-top:25px;border-radius:18px;background:#fff8d9;border:1px solid #ffe68a;padding:16px 18px;color:#5b4b14;font-size:.9rem}.page-title{margin:4px 0 20px}.page-title h2{margin:0;color:var(--blue);font-size:2rem}.page-title p{margin:5px 0;color:var(--muted)}footer{background:#062b67;color:#dce8ff;padding:28px 0}.foot{display:flex;gap:20px;align-items:center}.foot img{width:54px;height:54px;object-fit:contain;background:white;border-radius:50%}.foot strong{display:block;color:white}.foot small{color:#b7cbed}.modal-backdrop{position:fixed;inset:0;background:#061a38a8;z-index:30;display:none;overflow:auto;padding:20px}.modal-backdrop.show{display:block}.modal{max-width:760px;margin:30px auto;background:white;border-radius:22px;padding:24px;box-shadow:0 20px 80px #0004}.modal-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal h2{color:var(--blue);margin:0}.close{border:0;background:#edf2fa;border-radius:50%;width:40px;height:40px;font-size:1.3rem}.article-img{width:100%;max-height:360px;object-fit:cover;border-radius:15px;margin:18px 0}.article-copy{white-space:pre-line}.admin-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.admin-panel{border:1px solid var(--line);border-radius:16px;padding:17px}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:.82rem;font-weight:700;color:#34445d}.field input,.field textarea,.field select{width:100%;border:1px solid #d5deeb;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}.field textarea{min-height:110px;resize:vertical}.admin-list{display:flex;flex-direction:column;gap:9px;max-height:540px;overflow:auto}.admin-item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}.admin-item strong{display:block;font-size:.87rem}.admin-item small{color:var(--muted)}.mini-actions{display:flex;gap:6px;flex-wrap:wrap}.mini-actions button{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;font-size:.76rem;font-weight:700;color:var(--blue)}.mini-actions .delete{color:#a62626}.admin-help{font-size:.8rem;color:var(--muted)}.cartoon-mark{border:2px dashed #d4dfef;border-radius:14px;padding:16px;background:#fbfdff;text-align:center;color:var(--muted)}.hidden{display:none!important}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:21px}.hero-image{min-height:210px;grid-row:1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:160px}.admin-layout{grid-template-columns:1fr}.head{gap:10px}.logo{width:60px;height:60px}.brand p{font-size:.65rem}.head-actions .outline{display:none}}
@media(max-width:520px){.wrap{width:92%}.head{padding:9px 0}.logo{width:49px;height:49px}.brand h1{font-size:1.25rem}.brand p{font-size:.57rem;letter-spacing:.04em}.head-actions .pill{padding:8px 11px;font-size:.76rem}.nav-inner{width:100%;padding:7px 4%;gap:2px}.nav button{padding:9px 12px;font-size:.82rem}main{padding-top:17px}.hero{gap:15px;padding:17px;border-radius:20px}.hero h2{font-size:2rem}.hero-image{min-height:170px}.grid{grid-template-columns:1fr;gap:13px}.card{display:grid;grid-template-columns:112px 1fr}.card img{height:100%;min-height:160px}.card-body{padding:12px}.card h3{font-size:.96rem}.card p{font-size:.8rem;margin:6px 0 10px}.section-head{margin-top:25px}.section-head h2{font-size:1.25rem}.modal{margin:0 auto;padding:18px}.modal-backdrop{padding:10px}.foot{align-items:flex-start}}
</style>
</head>
<body>
<div class="topline"></div>
<header>
  <div class="wrap head">
    <img class="logo" src="assets/the-bulod-logo.png" alt="The Bulod publication logo">
    <div class="brand"><h1>The Bulod</h1><p>Canduhao Elementary School · School Publication</p></div>
    <div class="head-actions"><button class="outline" id="aboutBtn">About</button><button class="pill" id="adminBtn">Editor CMS ↗</button></div>
  </div>
  <nav class="nav"><div class="wrap nav-inner" id="nav">
    <button class="active" data-page="Home">Home</button><button data-page="News">News</button><button data-page="Feature">Feature</button><button data-page="Literary">Literary</button><button data-page="Sports">Sports</button><button data-page="Cartoons">Cartoons</button>
  </div></nav>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap foot"><img src="assets/the-bulod-logo.png" alt=""><div><strong>The Bulod — Canduhao Elementary School</strong><small>Stories • Ideas • Learners • A Brighter Canduhao</small><br><small>Student-centered school publication · Sample content for demonstration</small></div></div></footer>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><h2 id="modalTitle">Article</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><div id="modalBody"></div></section></div>
<script>
const sampleArticles = [
{id:"n1",category:"News",title:"Canduhao Learners Kick Off a Month of Reading",author:"The Bulod Staff",date:"2026-10-26",image:"https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1000&q=85",caption:"Learners take part in a joyful reading activity at school. (Sample photo)",summary:"A schoolwide celebration puts reading, imagination, and shared learning at the center.",content:"Canduhao Elementary School welcomes another opportunity to nurture a love for reading. Learners and teachers take part in classroom reading activities, story sharing, and simple challenges that make books a part of everyday learning.\\n\\nTeachers encourage every learner to read at their own pace, ask questions, and share ideas with classmates. Families are also invited to make time for stories at home.\\n\\nThis sample story is for layout demonstration. Replace it with a verified school report before publishing.",featured:true},
{id:"n2",category:"News",title:"School Community Works Together for a Better Learning Space",author:"The Bulod Staff",date:"2026-10-20",image:"https://images.unsplash.com/photo-1580582932707-520aed937b7b?auto=format&fit=crop&w=1000&q=85",caption:"A welcoming learning environment supports learners and teachers. (Sample photo)",summary:"A shared commitment to a safe, welcoming, and supportive school environment.",content:"A positive learning environment grows through teamwork. Learners, school personnel, families, and community partners can contribute by caring for classrooms, keeping pathways clear, and treating one another with respect.\\n\\nThe school publication highlights these everyday efforts to show how small acts of cooperation can make a meaningful difference.\\n\\nThis is placeholder content and should be replaced with verified details."},
{id:"f1",category:"Feature",title:"Small Acts, Big Impact: Growing a Greener School",author:"Bulod Feature Desk",date:"2026-10-18",image:"https://images.unsplash.com/photo-141687959&fit=crop&w=1000&q=85",caption:"A young plant represents care for the environment. (Sample photo)",summary:"Simple habits can help learners care for their school and community.",content:"A greener school begins with everyday choices: putting waste in the right bins, caring for plants, reusing materials when safe, and keeping shared spaces clean. These habits are small, but they become powerful when practiced together.\\n\\nLearners can lead by example and invite their families and friends to take part. Caring for the environment is also caring for the people who share it.\\n\\nSample feature copy — confirm all local details before publication."},
{id:"l1",category:"Literary",title:"A Little Seed of Hope",author:"Young Writers' Corner",date:"2026-10-17",image:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1000&q=85",caption:"Morning light over a field inspires this original sample piece.",summary:"An original short poem about patience, learning, and hope.",content:"A little seed beneath the ground,\\nDreams of sunlight all around.\\nWith gentle rain and care each day,\\nIt lifts its leaves and finds its way.\\n\\nLike that seed, we learn and grow,\\nStep by step, and row by row.\\nWith hope and kindness as we start,\\nWe grow a garden in the heart.\\n\\n— Sample poem for The Bulod"},
{id:"s1",category:"Sports",title:"Young Athletes Show Teamwork and Determination",author:"Bulod Sports Desk",date:"2026-10-15",image:"https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=1000&q=85",caption:"Young athletes practice skills and teamwork. (Sample photo)",summary:"Practice, respect, and teamwork are at the heart of school sports.",content:"School sports offer learners a chance to build confidence, discipline, and teamwork. In every practice, athletes learn to listen to coaches, respect teammates and opponents, and keep trying when a skill takes time to master.\\n\\nWinning can be exciting, but good sportsmanship matters just as much. The Bulod celebrates the effort and positive attitude that help every learner grow.\\n\\nSample story only. Add verified event details, results, and names before publishing."}
];
const defaultCartoons=[{id:"c1",title:"The Power of One More Page",author:"Bulod Cartoon Corner",date:"2026-10-10",caption:"A little reading every day adds up.",image:"https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1000&q=85",summary:"A placeholder cartoon feature. Replace with an original, school-appropriate cartoon image.",content:"Cartoon placeholder: upload an original cartoon drawing or illustration in the CMS. Make sure the artwork is appropriate for elementary learners and that you have permission to publish it."}];
const KEY="theBulodArticles_v1", CARTKEY="theBulodCartoons_v1";
let articles=load(KEY,sampleArticles), cartoons=load(CARTKEY,defaultCartoons), currentPage="Home", editingId=null;
function load(k,fallback){try{const x=localStorage.getItem(k);return x?JSON.parse(x):fallback}catch(e){return fallback}}
function save(){localStorage.setItem(KEY,JSON.stringify(articles));localStorage.setItem(CARTKEY,JSON.stringify(cartoons))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){if(!d)return "Date not set";let x=new Date(d+"T12:00:00");return isNaN(x) ? esc(d):x.toLocaleDateString("en-PH",{year:"numeric",month:"short",day:"numeric"})}
function imageUrl(a){return a.image||"https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1000&q=85"}
function card(a,cat){return `<article class="card"><img src="${esc(imageUrl(a))}" alt="${esc(a.caption||a.title)}" loading="lazy" onerror="this.src='https://placehold.co/800x500/eaf1fb/073b8c?text=The+Bulod'"><div class="card-body"><span class="tag">${esc(cat||a.category||"Story")}</span><h3>${esc(a.title)}</h3><div class="meta">By ${esc(a.author||"The Bulod Staff")} · ${fmt(a.date)}</div><p>${esc(a.summary||"Read the latest story from The Bulod.")}</p><button class="read" onclick="openStory('${esc(a.id)}','${cat==='Cartoons'?'cartoon':'article'}')">Read story →</button></div></article>`}
function section(title,items,cat){return `<div class="section-head"><div><h2>${title}</h2><p>Stories and voices from our school community</p></div><button class="outline" onclick="go('${cat}')">View all →</button></div><div class="grid">${items.length?items.map(a=>card(a,cat)).join(""):`<div class="empty">No stories yet. Add one in Editor CMS.</div>`}</div>`}
function home(){let feat=articles.find(a=>a.featured)||articles[0];return `<section class="hero"><div><span class="eyebrow">The school publication</span><h2>Stories. Ideas. Learners.<br><span style="color:var(--yellow)">A Brighter Canduhao.</span></h2><p>Welcome to <b>The Bulod</b>, the online publication of Canduhao Elementary School. Discover school news, inspiring features, young voices, and sports stories.</p><button class="pill" onclick="openStory('${feat?.id||""}')">Read the latest →</button></div><div class="hero-image" role="img" aria-label="Placeholder school learning photo"><span>Curious minds. Bright futures.</span></div></section>
${section("Latest News",articles.filter(a=>a.category==="News").slice(0,3),"News")}
${section("Featured Stories",articles.filter(a=>a.category==="Feature").slice(0,3),"Feature")}
${section("Literary Corner",articles.filter(a=>a.category==="Literary").slice(0,3),"Literary")}
${section("Sports Desk",articles.filter(a=>a.category==="Sports").slice(0,3),"Sports")}
<div class="notice"><b>Editorial reminder:</b> All articles and photos currently shown are placeholders. Verify facts, obtain appropriate photo permissions, and secure editorial approval before publishing.</div>`}
function listing(cat){let items=cat==="Cartoons"?cartoons:articles.filter(a=>a.category===cat);let subtitle={News:"Verified updates, announcements, and stories from our school community.",Feature:"People, projects, and ideas that inspire our learners.",Literary:"Poems, stories, and creative writing by young voices.",Sports:"Teamwork, sportsmanship, and school athletic stories.",Cartoons:"Original, school-appropriate cartoons and illustrations."}[cat];return `<div class="page-title"><span class="eyebrow">${cat==="Cartoons"?"Creative Corner":"The Bulod · "+cat}</span><h2>${cat==="Literary"?"Literary Corner":cat==="Cartoons"?"Cartoons":cat+" Stories"}</h2><p>${subtitle}</p></div><div class="grid">${items.length?items.map(a=>card(a,cat)).join(""):`<div class="empty">Nothing published here yet. Use Editor CMS to add content.</div>`}</div>`}
function go(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){document.getElementById("app").innerHTML=currentPage==="Home"?home():currentPage==="CMS"?cms():listing(currentPage)}
function openStory(id,type="article"){let a=(type==="cartoon"?cartoons:articles).find(x=>x.id===id);if(!a)return;document.getElementById("modalTitle").textContent=a.title;document.getElementById("modalBody").innerHTML=`<img class="article-img" src="${esc(imageUrl(a))}" alt="${esc(a.caption||a.title)}" onerror="this.src='https://placehold.co/800x500/eaf1fb/073b8c?text=The+Bulod'"><div class="meta">By ${esc(a.author||"The Bulod Staff")} · ${fmt(a.date)}${a.category?" · "+esc(a.category):""}</div><p class="meta"><b>Photo caption:</b> ${esc(a.caption||"Caption not supplied.")}</p><div class="article-copy">${esc(a.content||a.summary||"Content coming soon.")}</div><p class="admin-help">Sample content — replace with an approved story before public release.</p>`;document.getElementById("modalBackdrop").classList.add("show")}
function cms(){return `<div class="page-title"><span class="eyebrow">Content management</span><h2>Editor CMS</h2><p>Add, update, and remove stories or cartoons in this browser.</p></div><div class="notice"><b>Demo CMS:</b> Content is saved only in this browser using local storage. There is no login, server, cloud backup, or multi-editor sync. Do not store sensitive information. For a public school website, connect a secure backend and authorized accounts before deployment.</div><div class="admin-layout"><section class="admin-panel"><h3 id="formTitle">Add a story</h3><form id="articleForm">
<div class="field"><label for="kind">Content type</label><select id="kind"><option>News</option><option>Feature</option><option>Literary</option><option>Sports</option><option>Cartoons</option></select></div>
<div class="field"><label for="title">Title *</label><input id="title" required maxlength="160" placeholder="Enter headline or title"></div>
<div class="field"><label for="author">Author / byline</label><input id="author" placeholder="The Bulod Staff"></div>
<div class="field"><label for="date">Publication date</label><input id="date" type="date"></div>
<div class="field"><label for="image">Image URL</label><input id="image" type="url" placeholder="https://..."><small class="admin-help">Use a public image URL. For a real deployment, add secure image uploads.</small></div>
<div class="field"><label for="caption">Photo caption / artwork note</label><input id="caption" placeholder="Describe the image and credit, if needed"></div>
<div class="field"><label for="summary">Short summary</label><textarea id="summary" placeholder="A short teaser for the story card"></textarea></div>
<div class="field"><label for="content">Full story / literary content</label><textarea id="content" placeholder="Write the full approved content here"></textarea></div>
<label style="display:flex;gap:8px;align-items:center;font-size:.86rem"><input id="featured" type="checkbox"> Feature this story on the home page</label>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button class="pill" type="submit" id="saveBtn">Save content</button><button class="outline" type="button" onclick="resetForm()">Clear form</button></div></form></section>
<section class="admin-panel"><h3>Published / saved content</h3><div class="field"><label for="filter">Filter list</label><select id="filter" onchange="renderAdminList()"><option>All</option><option>News</option><option>Feature</option><option>Literary</option><option>Sports</option><option>Cartoons</option></select></div><div id="adminList" class="admin-list"></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Backup</h3><p class="admin-help">Export your content as JSON before clearing browser data or changing devices.</p><button class="outline" onclick="exportData()">Export JSON backup</button> <button class="outline" onclick="document.getElementById('importFile').click()">Import JSON</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"><p class="admin-help">Import replaces current saved content in this browser.</p></section></div>`}
function resetForm(){editingId=null;const f=document.getElementById("articleForm");if(f)f.reset();const title=document.getElementById("formTitle");if(title)title.textContent="Add a story";const saveBtn=document.getElementById("saveBtn");if(saveBtn)saveBtn.textContent="Save content"}
function renderAdminList(){const box=document.getElementById("adminList");if(!box)return;const filter=document.getElementById("filter")?.value||"All";let items=[...articles.map(a=>({...a,kind:a.category})),...cartoons.map(a=>({...a,kind:"Cartoons"}))].filter(a=>filter==="All"||a.kind===filter).sort((a,b)=>(b.date||"").localeCompare(a.date||""));box.innerHTML=items.length?items.map(a=>`<div class="admin-item"><div><strong>${esc(a.title)}</strong><small>${esc(a.kind)} · ${fmt(a.date)}</small></div><div class="mini-actions"><button onclick="editItem('${esc(a.id)}','${a.kind==="Cartoons"?"cartoon":"article"}')">Edit</button><button class="delete" onclick="deleteItem('${esc(a.id)}','${a.kind==="Cartoons"?"cartoon":"article"}')">Delete</button></div></div>`).join(""):`<div class="empty">No saved content in this category.</div>`}
function editItem(id,type){let a=(type==="cartoon"?cartoons:articles).find(x=>x.id===id);if(!a)return;editingId=id;document.getElementById("kind").value=type==="cartoon"?"Cartoons":a.category;for(const k of ["title","author","date","image","caption","summary","content"])document.getElementById(k).value=a[k]||"";document.getElementById("featured").checked=!!a.featured;document.getElementById("formTitle").textContent="Edit content";document.getElementById("saveBtn").textContent="Update content";document.getElementById("articleForm").scrollIntoView({behavior:"smooth",block:"start"})}
function deleteItem(id,type){if(!confirm("Delete this item? This cannot be undone unless you have a backup."))return;if(type==="cartoon")cartoons=cartoons.filter(a=>a.id!==id);else articles=articles.filter(a=>a.id!==id);save();render();renderAdminList()}
function exportData(){const blob=new Blob([JSON.stringify({articles,cartoons},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="the-bulod-backup.json";a.click();URL.revokeObjectURL(url)}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.articles)||!Array.isArray(d.cartoons))throw Error("Invalid format");if(!confirm("Replace current content with this backup?"))return;articles=d.articles;cartoons=d.cartoons;save();render();renderAdminList();alert("Backup imported.")}catch(err){alert("Could not import: please select a valid The Bulod JSON backup.")}};r.readAsText(file);e.target.value=""}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("adminBtn").addEventListener("click",()=>{go("CMS");renderAdminList()});
document.getElementById("aboutBtn").addEventListener("click",()=>{document.getElementById("modalTitle").textContent="About The Bulod";document.getElementById("modalBody").innerHTML=`<p><b>The Bulod</b> is the online school publication of Canduhao Elementary School.</p><p>Our goal is to share verified school news, celebrate learner achievements, nurture young writers, and highlight teamwork and creativity.</p><p class="admin-help">This prototype uses sample content and browser-only editing. Obtain school approval, follow DepEd policies and child safeguarding/privacy requirements, and use authorized photos and bylines before launching publicly.</p>`;document.getElementById("modalBackdrop").classList.add("show")});
document.getElementById("closeModal").addEventListener("click",()=>document.getElementById("modalBackdrop").classList.remove("show"));
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")e.currentTarget.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("modalBackdrop").classList.remove("show")});
document.addEventListener("submit",e=>{if(e.target.id!=="articleForm")return;e.preventDefault();const kind=document.getElementById("kind").value;const obj={id:editingId||("a"+Date.now()),category:kind==="Cartoons"?"Cartoons":kind,title:document.getElementById("title").value.trim(),author:document.getElementById("author").value.trim()||"The Bulod Staff",date:document.getElementById("date").value,image:document.getElementById("image").value.trim(),caption:document.getElementById("caption").value.trim(),summary:document.getElementById("summary").value.trim(),content:document.getElementById("content").value.trim(),featured:document.getElementById("featured").checked};if(!obj.title)return;if(kind==="Cartoons"){if(editingId)cartoons=cartoons.filter(a=>a.id!==editingId);cartoons.unshift(obj)}else{if(editingId)articles=articles.filter(a=>a.id!==editingId);articles.unshift(obj)}save();resetForm();render();renderAdminList();alert("Content saved in this browser.")});
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
render();
</script>
</body>
</html>
